name: release

# Build standalone desktop executables and attach them to a GitHub Release.
# Triggers on a version tag (e.g. `v0.1.0`), or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pwc-app-windows.exe
            built: dist/pwc-app.exe
          - os: macos-latest
            artifact: pwc-app-macos
            built: dist/pwc-app
          - os: ubuntu-latest
            artifact: pwc-app-linux
            built: dist/pwc-app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux Tk (build host needs the module present)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: pyinstaller packaging/pwc-app.spec

      - name: Rename for upload
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/${{ matrix.artifact }}
