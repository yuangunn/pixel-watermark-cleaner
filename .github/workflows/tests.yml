name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  gui-smoke:
    # The picker/app geometry and document model are unit-tested headlessly;
    # this job additionally exercises the real Tkinter window, mouse painting,
    # clean/undo/save and rendering under a virtual framebuffer (Xvfb).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Tk + Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Drive picker + app under Xvfb
        run: xvfb-run -a python tests/gui_smoke.py
