[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-watermark-cleaner"
version = "0.1.0"
description = "Batch-regenerate a visible watermark region in generated images via local inpainting."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["inpainting", "watermark", "pixel-art", "opencv", "cli", "game-assets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Environment :: Console",
]
# Core stays intentionally light: OpenCV + numpy only.
dependencies = [
    "opencv-python-headless>=4.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/yuangunn/pixel-watermark-cleaner"

[project.scripts]
pwc = "clean:main"

[tool.setuptools]
# clean.py is a single top-level module, not a package.
py-modules = ["clean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
