<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2330" />
  <title>pixel-watermark-cleaner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <strong>pixel-watermark-cleaner</strong>
    <span class="muted">offline · paint over a watermark, Clean, save</span>
  </header>

  <div id="toolbar" class="toolbar" hidden>
    <label class="btn">Open…<input id="files" type="file" accept="image/*" multiple hidden /></label>

    <span class="group" role="radiogroup" aria-label="Tool">
      <label><input type="radio" name="tool" value="brush" checked /> Brush</label>
      <label><input type="radio" name="tool" value="box" /> Box</label>
      <label><input type="radio" name="tool" value="erase" /> Erase</label>
    </span>

    <label class="group">Size <input id="size" type="range" min="2" max="80" value="14" /></label>

    <label class="group">Engine
      <select id="method"><option value="telea">telea</option><option value="ns">ns</option></select>
    </label>
    <label class="group"><input id="palette" type="checkbox" /> Palette</label>
    <label class="group">Grow <input id="grow" type="number" min="0" max="20" value="2" /></label>

    <span class="group">
      <button id="preview" class="btn">Preview</button>
      <button id="undo" class="btn">Undo</button>
      <button id="clear" class="btn">Clear</button>
    </span>

    <button id="run" class="btn primary">Clean all &amp; download</button>
  </div>

  <main id="stage">
    <div id="dropzone" class="dropzone">
      <p><strong>Drop images here</strong> or <label class="link" for="files2">choose files</label>.</p>
      <p class="muted">Batch tip: load several images of the <em>same size</em> with the watermark in the
        <em>same spot</em> — paint once, clean them all.</p>
      <input id="files2" type="file" accept="image/*" multiple hidden />
    </div>
    <canvas id="view" hidden></canvas>
  </main>

  <footer id="status" class="status">Loading…</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
